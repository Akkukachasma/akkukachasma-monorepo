# ============================================================
#  Production Deploy — Akkukachasma Monorepo
# ============================================================
#
#  Strategy: Build on GitHub Actions → rsync to server → reload PM2
#
#  Required GitHub Secrets:
#  ┌──────────────────┬─────────────────────────────────────────────┐
#  │ SSH_HOST         │ 31.42.125.213                               │
#  │ SSH_USER         │ root                                        │
#  │ SSH_PRIVATE_KEY  │ contents of the ed25519 private key         │
#  │ API_ENV          │ Full contents of apps/api/.env              │
#  │ WEB_ENV          │ Full contents of apps/web/.env              │
#  └──────────────────┴─────────────────────────────────────────────┘
# ============================================================

name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────
  #  Job 1 — Build API
  # ─────────────────────────────────────────────────────────────────
  build-api:
    name: 🔨 Build API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write API .env
        run: printf '%s' "$API_ENV" > apps/api/.env
        env:
          API_ENV: ${{ secrets.API_ENV }}

      - name: Generate Prisma client & build API
        run: |
          cd apps/api
          npx prisma generate
          pnpm build

      - name: Upload API dist
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: apps/api/dist/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────
  #  Job 2 — Build Web
  # ─────────────────────────────────────────────────────────────────
  build-web:
    name: 🔨 Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write Web .env
        run: printf '%s' "$WEB_ENV" > apps/web/.env
        env:
          WEB_ENV: ${{ secrets.WEB_ENV }}

      - name: Build Next.js
        run: cd apps/web && pnpm build

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            apps/web/.next/
            !apps/web/.next/cache/
          # .next is a hidden dir — hidden files are skipped by default in upload-artifact@v4
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────
  #  Job 3 — Deploy API
  # ─────────────────────────────────────────────────────────────────
  deploy-api:
    name: 🚀 Deploy API
    runs-on: ubuntu-latest
    needs: build-api

    steps:
      - name: Checkout (for config files)
        uses: actions/checkout@v4

      - name: Download API dist
        uses: actions/download-artifact@v4
        with:
          name: api-dist
          path: api-dist/

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: rsync config + API dist to server
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
          SERVER="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          REMOTE="/root/akkukachasma_monorepo"

          rsync -avz -e "$SSH_CMD" \
            ecosystem.config.js \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            package.json \
            "$SERVER:$REMOTE/"

          rsync -avz --delete -e "$SSH_CMD" \
            api-dist/ \
            "$SERVER:$REMOTE/apps/api/dist/"

      - name: Write .env, install deps & restart API
        uses: appleboy/ssh-action@v1.0.3
        env:
          API_ENV: ${{ secrets.API_ENV }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: API_ENV
          command_timeout: 10m
          script: |
            set -e
            cd /root/akkukachasma_monorepo

            printf '%s' "$API_ENV" > apps/api/.env

            export CI=true
            pnpm install --frozen-lockfile

            pm2 delete akkukachasma-api 2>/dev/null || true
            pm2 start ecosystem.config.js --only akkukachasma-api
            pm2 save
            echo "✅ API deployed"

  # ─────────────────────────────────────────────────────────────────
  #  Job 4 — Deploy Web
  # ─────────────────────────────────────────────────────────────────
  deploy-web:
    name: 🌐 Deploy Web
    runs-on: ubuntu-latest
    needs: [build-web, deploy-api]

    steps:
      - name: Download Web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build/

      - name: Verify web build artifact
        run: |
          ls -la web-build/ | head -20
          test -f web-build/BUILD_ID || { echo "❌ BUILD_ID missing — artifact layout is wrong"; exit 1; }
          test -d web-build/server || { echo "❌ server/ missing"; exit 1; }
          test -d web-build/static || { echo "❌ static/ missing"; exit 1; }
          echo "✅ Web build artifact looks good"

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: rsync Web build to server
        run: |
          # --exclude='/cache/' keeps the server's resized-image cache (.next/cache) across deploys
          rsync -avz --delete \
            --exclude='/cache/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            web-build/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/root/akkukachasma_monorepo/apps/web/.next/

      - name: Write .env & restart Web
        uses: appleboy/ssh-action@v1.0.3
        env:
          WEB_ENV: ${{ secrets.WEB_ENV }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: WEB_ENV
          command_timeout: 5m
          script: |
            set -e
            cd /root/akkukachasma_monorepo

            printf '%s' "$WEB_ENV" > apps/web/.env

            pm2 delete akkukachasma-web 2>/dev/null || true
            pm2 start ecosystem.config.js --only akkukachasma-web

            sleep 5
            ONLINE=$(pm2 jlist | node -e "
              const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
              console.log(d.filter(p=>p.name==='akkukachasma-web'&&p.pm2_env.status==='online').length)
            ")
            if [ "$ONLINE" -eq 0 ]; then
              echo "❌ Web failed to start! Logs:"
              pm2 logs akkukachasma-web --lines 20 --nostream
              exit 1
            fi

            pm2 save
            echo "✅ Web deployed ($ONLINE instances online)"
